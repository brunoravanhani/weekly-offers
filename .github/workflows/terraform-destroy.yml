name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment/state key suffix
        required: true
        default: dev
      force_destroy_buckets:
        description: Empty and destroy S3 buckets even when they still contain objects
        required: true
        type: boolean
        default: false
      confirm_destroy:
        description: Type DESTROY to continue
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    if: ${{ github.event.inputs.confirm_destroy == 'DESTROY' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: weekly-offers/${{ github.event.inputs.environment }}/terraform.tfstate
      TF_ENVIRONMENT: ${{ github.event.inputs.environment }}
      TF_FORCE_DESTROY_BUCKETS: ${{ github.event.inputs.force_destroy_buckets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lambda dependencies
        run: |
          cd lambda/csv-to-json
          npm ci
          cd ../presign-upload
          npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Destroy
        working-directory: infra
        run: |
          terraform destroy -auto-approve \
            -var="environment=${TF_ENVIRONMENT}" \
            -var="csv_bucket_force_destroy=${TF_FORCE_DESTROY_BUCKETS}" \
            -var="site_bucket_force_destroy=${TF_FORCE_DESTROY_BUCKETS}"

  destroy-not-confirmed:
    if: ${{ github.event.inputs.confirm_destroy != 'DESTROY' }}
    runs-on: ubuntu-latest

    steps:
      - name: Confirmation missing
        run: |
          echo "Refusing to destroy infrastructure. Re-run the workflow and set confirm_destroy to DESTROY."
          exit 1